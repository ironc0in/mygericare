- id: katsoyannis
  name: Katherine Katsoyannis
  cred: M.D.
  role: Physician
  languages: Greek
  photo: katherine-katsoyannis.jpeg
  bio:
    - >-
      Dr. Katsoyannis received her medical degree from Mt. Sinai School of Medicine now Carl Icahn.
      She then completed an Internal Medicine residency and fellowship in Geriatric Medicine at North
      Shore University Hospital in New York. She is board certified in Internal Medicine and Geriatric
      Medicine. Dr. Katsoyannis is also credentialed and affiliated with Advocate Aurora Healthcare and
      Northshore University Health system. She owns and operates her own private medical practice in
      Park Ridge, IL, and serves as medical director at multiple residential facilities for seniors.
      She partners with the local hospitalist group when hospitalization is necessary and maintains
      open communication with providers, patients, and families. She enjoys caring for patients in a
      collaborative manner promoting their well-being. She believes in an educational approach with a
      soft gentle touch through each step of the treatment with every patient. Dr. Katsoyannis is also
      fluent in the greek language.

- id: bazan
  name: Andrea Bazan
  cred: M.D.
  role: Physician
  photo: bazan1.jpeg
  bio:
    - >-
      Dr. Bazan received her medical degree at Chicago Medical School in 1994. She then completed her
      Internal Medicine residency at Rush Presbyterian St. Luke’s in Chicago in 1997. She is constantly
      researching and evolving her craft by continuing education. She takes a multidisciplinary approach
      to healthy aging so as to incorporate lifestyle, nutrition & fitness into her patient’s treatment
      plans.

- id: nehme
  name: Nadine Nehme
  cred: M.D.
  role: Physician
  languages: French & Arabic
  photo: nehme-1.jpeg
  bio:
    - >-
      Dr. Nehme is board certified in internal medicine. She has over 20 years of experience in both
      inpatient and outpatient medicine. She did her medical school at the University of Geneva,
      Switzerland and then completed a residency in internal medicine at Saint Joseph Hospital in
      Chicago. Dr. Nehme is also fluent in the French and Arabic languages.

- id: griffith
  name: Carissa Griffith
  cred: PA-C
  role: Physician Assistant
  photo: carissa.jpeg
  bio:
    - >-
      Carissa Griffith PA-C, is a Physician Assistant specializing in adult medicine. She graduated
      from Rose Hulman Institute of Technology with a Bachelor of Science in Mechanical Engineering and
      subsequently from Clemson University with a Master of Science in Bioengineering. She completed
      her physician assistant studies at Midwestern University in 2008. Carissa started working with
      Dr. Katherine Katsoyannis in 2009. She is known for her caring, gentle touch, and patience.

- id: yohannan
  name: Jenny Yohannan
  cred: APN
  role: Nurse Practitioner
  photo: jenny.jpeg
  bio:
    - >-
      Jenny Yohannan is on staff with Gericare Ltd. as a nurse practitioner. She graduated in 2020 from
      the University of Saint Francis in IL and has over 10 years of experience in nursing. Her
      experience ranges from critical care inpatient hospital settings through primary care outpatient
      settings. More recently she has been working in various facilities in IL such as skilled nursing
      facilities, assisted living facilities, memory care and independent living facilities. Her
      passion is to improve patient outcomes and provide best in class care plans in collaboration with
      families and other medical professionals. With a heavy background in critical care she is able to
      quickly assess risk to provide patient care that entails performing a thorough comprehensive
      physical assessment, accurately diagnosing, and implementing a treatment plan that optimizes
      patient care.

- id: derylo
  name: Maria Derylo
  cred: DNP-APN
  role: Nurse Practitioner
  languages: Polish, Russian & German
  photo: maria.jpeg
  bio:
    - >-
      Dr Maria Derylo DNP, MSN, APN-BC, is a dedicated Professor and Nurse Practitioner with over 25
      years of experience providing Care in hospital and clinical environments. Her background includes
      teaching, research, Management, geriatrics, public health, and occupational health in the
      medical/surgical And obstetric areas. She has received her post-master’s Adult NP certificate from
      University of Nebraska Medical Center, Omaha, and Her Doctor of Nursing Practice from Case Western
      Reserve University in Cleveland, Ohio. Maria is also fluent in the Polish, Russian, and German
      languages.

- id: fox
  name: Debra Fox
  cred: FNP-BC
  role: Nurse Practitioner
  photo: debbie.jpeg
  bio:
    - >-
      Debra Fox, FNP-BC, specializing in Adult Medicine. She graduated from The College of Mount Saint
      Vincent with a BSN and a minor in Biochemistry. She completed her Masters at Long Island
      University as a Family Nurse Practitioner. Prior to joining Gericare, she worked in Hospice and
      Palliative Care for the adult and pediatric population. She has over 20 years nursing experience.
      Debra is known as a strong patient advocate. She is described as a little bit funny as she knows
      that laughing is some of the best medicine.

- id: theodore
  name: Melissa Theodore
  cred: APN
  role: Nurse Practitioner
  photo: mtheodore-head-shot.jpeg
  bio:
    - >-
      Melissa Theodore has been a Nurse Practitioner for 10 years. She trained at Rush University and
      has spent her career caring for patients residing in assisted living communities and long-term
      care. Melissa specializes in chronic disease management and advanced care planning. She enjoys
      partnering with families, patients and facility staff to provide the best and most compassionate
      patient care possible.

- id: degraf
  name: Junine DeGraf
  cred: APN
  role: Nurse Practitioner
  photo: junine-1.jpeg
  bio:
    - >-
      Junine DeGraf APN is a Nurse Practitioner with over 20 years of clinical experience as a primary
      care provider. She has worked locally in the hospital, skilled nursing facilities, assisted living
      facilities, memory care and independent living facilities. Her special interests include
      geriatric medicine, prevention, and nutrition, management of chronic kidney disease,
      hypertension, and electrolyte disorders. She enjoys building relationships and is committed to
      working with patients, families, facilities, office staff and approach to care for her patients.

- id: adams
  name: Merchant Adams
  cred: APN
  role: Nurse Practitioner
  languages: Spanish
  photo: Merchant.jpg
  bio:
    - >-
      Merchant Adams is a nurse practitioner with full practice authority in Illinois. Previously
      trained as a studio artist with an MFA from the School of the Art Institute, Merchant was a
      practicing artist with extensive teaching experience at the university level for nearly 15 years
      before changing his career. He received his NP certification through the University of Illinois
      at Chicago. He has several years of experience managing health care in skilled nursing
      facilities. Merchant is a published writer specializing in art criticism and Early Netherlandish
      painting. He also holds a black belt in Brazilian Jiu-jitsu. Merchant is conversational in
      Spanish.

- id: lee
  name: Bonnie Lee
  cred: APN
  role: Nurse Practitioner
  languages: Korean
  photo: bonnie.jpg
  bio:
    - >-
      Bonnie Lee is a Nurse Practitioner specializing in adult medicine. Her nursing training began in
      South Korea, and she later achieved her BSN and MSN degrees from North Park University. Bonnie’s
      nursing career spans over 40 years, in diverse backgrounds including inpatient and outpatient
      care, work in surgical units, wound care, aesthetics, and geriatric care. Most recently she has
      joined Dr. Katsoyannis’ team, providing care at residential facilities. She values building
      strong relationships with her patients and facility staff members to deliver the best care
      possible. Bonnie is fluent in Korean with full practice authority in Illinois. In her free time
      you will most likely find her crafting or visiting her grandchildren in San Diego.

- id: guevara
  name: Mary-Jennelle Guevara
  cred: APN
  role: Nurse Practitioner
  languages: Tagalog & Ilonggo
  photo: jennelle.jpg
  bio:
    - >-
      Mary-Jennelle Guevara, ACNP-BC, is a Board Certified Full Practice Authority Nurse Practitioner
      specializing in Acute Care. She attended the University of Illinois at Chicago for her Bachelors
      (graduated Cum Laude in 2005) and Masters Degree in Nursing (graduated in 2012). She began her
      nursing journey as a new grad RN in the Medical/Cardiac ICU at Advocate Lutheran General Hospital
      in 2005, and subsequently transitioned to her role as one of the first Internal Medicine
      Hospitalist NPs there in 2012.
    - >-
      In addition, Jennelle is also experienced in managing patients in the clinic, skilled/long term
      care settings, and assisted living facilities. She is fluent in 3 languages: Tagalog, Ilonggo,
      and English. Jennelle’s background in critical care nursing and her vast experience in multiple
      milieus of healthcare as a nurse practitioner has paved the foundation for her holistic and
      patient focused approach practice.
