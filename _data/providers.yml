# Providers shown on the Providers page (in this order).
# The first three also appear on the Home page.
#
#   name:      full name
#   cred:      credentials shown under the name
#   role:      Physician / Physician Assistant / Nurse Practitioner
#   languages: optional, shown as "Speaks ..." (leave out if none)
